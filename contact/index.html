<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Get in touch with Maximanu.DE.">

    <title>Contact - Maximanu.DE</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="header"></div>

    <main>
        <section class="page-header">
            <div class="container">
                <div class="hero-badge">
                    <i class="bi bi-chat-dots"></i>
                    Contact
                </div>

                <h1>Let's talk.</h1>

                <p>
                    Have a question, an idea or something you'd like
                    to discuss? Get in touch.
                </p>
            </div>
        </section>

        <section class="section pt-0">
            <div class="container">
                <div class="row g-5">
                    <div class="col-lg-5">
                        <div class="section-heading">
                            <div class="eyebrow">Get in touch</div>

                            <h2>Start a conversation.</h2>

                            <p>
                                For questions about projects, collaborations
                                or anything related to Maximanu.DE,
                                you can reach out directly.
                            </p>
                        </div>

                        <div class="contact-card">
                            <div class="d-flex gap-3 align-items-start">
                                <div class="feature-icon flex-shrink-0">
                                    <i class="bi bi-envelope"></i>
                                </div>

                                <div>
                                    <h3 class="h6 fw-bold">Email</h3>

                                    <p class="text-body-secondary mb-0">
                                        Replace this with your public
                                        contact address.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="contact-card">
                            <form>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="name" class="form-label">
                                            Name
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="name"
                                               name="name"
                                               autocomplete="name"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="email" class="form-label">
                                            Email
                                        </label>

                                        <input type="email"
                                               class="form-control"
                                               id="email"
                                               name="email"
                                               autocomplete="email"
                                               required>
                                    </div>

                                    <div class="col-12">
                                        <label for="subject" class="form-label">
                                            Subject
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="subject"
                                               name="subject"
                                               required>
                                    </div>

                                    <div class="col-12">
                                        <label for="message" class="form-label">
                                            Message
                                        </label>

                                        <textarea class="form-control"
                                                  id="message"
                                                  name="message"
                                                  rows="6"
                                                  required></textarea>
                                    </div>

                                    <div class="col-12">
                                        <button type="submit"
                                                class="btn btn-primary">
                                            Send Message
                                            <i class="bi bi-arrow-right ms-1"></i>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
